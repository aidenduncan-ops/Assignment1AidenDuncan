<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>ContactMe</title>
        <meta name="viewport" content="width=device-width">
        <link href="style.css" rel="stylesheet">
        <link href="full.css" rel="stylesheet"
        media="only screen and (min-width:960px)">
        <link href="tablet.css" rel="stylesheet" type="text/css"
        media="only screen and (min-width:481px) and (max-width:959px)">
        <!--style sheet is for smart phone-->
        <link href="smartphone.css" rel="stylesheet"
        media="only screen and (max-width:480px)">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!--imports pre built fonts for use in website-->
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"> 
    </head>
    <body>
        <h1> Contact Form</h1>
        <div id="wrapper">
            <form 
            action="mailto:aiden.duncan@ontariotechu.net"
            method="post"
            enctype="text/plain"
            name="form">
            <p>
                <label for="Fname">First Name :</label>
                <input type="text" name="Fname" size="32"
                placeholder="Enter your first name" 
                required>
            </p>
            <p>
                <label for="Lname">Last Name :</label>
                <input type="text" name="Lname" size="32"
                placeholder="Enter your last name" 
                required>
            </p>
            <p>
                <label for="email">Email :</label>
                <input type="email" name="email" size="32" 
                placeholder="Enter your email address" required>
            </p>
            <input type="submit" value="Click here to submit the form">
            <input type="reset" value="Click here to reset the form">
        
            </form>
        </div>
    </body>
</html>
